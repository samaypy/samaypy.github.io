<!DOCTYPE html>

<head>

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100vh;}
  body{
    min-height:100vh;
    background: var(--bg, #8ace00);
    color: var(--fg, #111111);
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 24px;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><circle cx="10" cy="10" r="7" fill="black" stroke="white" stroke-width="2"/></svg>') 10 10, auto;
    transition: background-color 0.7s ease, color 0.7s ease;
  }
  a{
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"><circle cx="13" cy="13" r="10" fill="black" stroke="white" stroke-width="2"/></svg>') 13 13, pointer;
  }

  .page{
    width:100%;
    max-width:520px;
  }

  .headline{
    font-family:"Arial Narrow",Arial,sans-serif;
    font-weight:400;
    text-transform:lowercase;
    letter-spacing:-0.5px;
    font-size:clamp(52px,13vw,88px);
    color: var(--fg, #111111);
    filter:blur(1.3px);
    line-height:0.9;
    user-select:none;
    transition: color 0.7s ease;
  }

  .links{
    margin-top:52px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .row{
    text-decoration:none;
    font-family:"Arial Narrow",Arial,sans-serif;
    font-weight:400;
    text-transform:lowercase;
    letter-spacing:-0.2px;
    font-size:clamp(22px,6vw,30px);
    color: var(--fg, #111111);
    filter:blur(1.1px);
    line-height:1.15;
    transition: color 0.7s ease;
  }

  .counter{
    margin-top:44px;
    font-family:"Arial Narrow",Arial,sans-serif;
    font-weight:400;
    text-transform:lowercase;
    font-size:17px;
    color: var(--fg, #111111);
    filter:blur(1px);
    letter-spacing:0.2px;
    transition: color 0.7s ease;
  }

  .theme-toggle{
    position:fixed;
    bottom:18px;
    right:18px;
    width:22px;
    height:22px;
    border-radius:50%;
    background: var(--fg, #111111);
    opacity:0.35;
    cursor:pointer;
    transition: background-color 0.7s ease, opacity 0.2s ease;
    border:none;
    padding:0;
  }
  .theme-toggle:hover{ opacity:0.7; }
</style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle" aria-label="change color theme"></button>

  <div class="page">
    <div class="headline">samay</div>

    <div class="links">
      <a class="row" href="https://instagram.com/samay.jpg" target="_blank" rel="noopener">instagram</a>
      <a class="row" href="https://wa.me/919414848901" target="_blank" rel="noopener">whatsapp</a>
      <a class="row" href="tel:+917230072629">call</a>
      <a class="row" href="mailto:samaychandak06@gmail.com">email</a>
      <a class="row" href="https://linkedin.com/in/samaychandak" target="_blank" rel="noopener">linkedin</a>
      <a class="row" href="https://in.pinterest.com/wtfsamay/" target="_blank" rel="noopener">pinterest</a>
      <a class="row" href="https://github.com/samaypy" target="_blank" rel="noopener">github</a>
      <a class="row" href="https://twitter.com/okaysamay" target="_blank" rel="noopener">twitter</a>
      <a class="row" href="http://sptfy.in/samay" target="_blank" rel="noopener">spotify</a>
      <a class="row" href="https://t.me/samayyyy" target="_blank" rel="noopener">telegram</a>
      <a class="row" href="https://discord.com/users/newuton" target="_blank" rel="noopener">discord</a>
      <a class="row" href="https://youtube.com/@samay.mp4" target="_blank" rel="noopener">youtube</a>
    </div>

    <div class="counter" id="visitCounter">visitor no. 0</div>
  </div>

  <script>
    (function(){
      var themes = [
        { bg:'#ffffff', fg:'#111111' },
        { bg:'#0a009c', fg:'#111111' },
        { bg:'#851812', fg:'#111111' },
        { bg:'#8ace00', fg:'#111111' }, // default
        { bg:'#111111', fg:'#8ace00' }
      ];
      var idx = 3; // start on default green
      var metaTheme = document.getElementById('themeColorMeta');

      function applyTheme(i){
        var t = themes[i];
        document.body.style.setProperty('--bg', t.bg);
        document.body.style.setProperty('--fg', t.fg);
        metaTheme.setAttribute('content', t.bg);
      }

      applyTheme(idx);

      document.getElementById('themeToggle').addEventListener('click', function(){
        idx = (idx + 1) % themes.length;
        applyTheme(idx);
      });
    })();
  </script>

  <script>
    (function(){
      var el = document.getElementById('visitCounter');
      var namespace = 'samay-contact-links';
      var key = 'visits';
      fetch('https://api.countapi.xyz/hit/' + namespace + '/' + key)
        .then(function(res){ return res.json(); })
        .then(function(data){
          var pad = String(data.value).padStart(4, '0');
          el.textContent = 'visitor no. ' + pad;
        })
        .catch(function(){
          el.textContent = 'visitor no. ----';
        });
    })();
  </script>

</body>
</html>
