<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100vh;}
  body{
    min-height:100vh;
    background: var(--bg, #8ace00);
    color: var(--fg, #111111);
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 24px;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><line x1="10" y1="2" x2="10" y2="18" stroke="black" stroke-width="2"/><line x1="2" y1="10" x2="18" y2="10" stroke="black" stroke-width="2"/></svg>') 10 10, auto;
    transition: background-color 0.7s ease, color 0.7s ease;
  }
  ::selection{
    background: var(--fg, #111111);
    color: var(--bg, #8ace00);
  }
  a{
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="9" fill="black"/></svg>') 12 12, pointer;
  }

  .page{
    width:100%;
    max-width:520px;
  }

  .headline{
    font-family:"Arial Narrow",Arial,sans-serif;
    font-weight:400;
    text-transform:lowercase;
    letter-spacing:-0.5px;
    font-size:clamp(52px,13vw,88px);
    color: var(--fg, #111111);
    filter:blur(1.3px);
    line-height:0.9;
    user-select:none;
    transition: color 0.7s ease;
  }

  .links{
    margin-top:52px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .row{
    text-decoration:none;
    font-family:"Arial Narrow",Arial,sans-serif;
    font-weight:400;
    text-transform:lowercase;
    letter-spacing:-0.2px;
    font-size:clamp(22px,6vw,30px);
    color: var(--fg, #111111);
    filter:blur(1.1px);
    line-height:1.15;
    transition: color 0.7s ease;
  }

  .counter{
    margin-top:44px;
    font-family:"Arial Narrow",Arial,sans-serif;
    font-weight:400;
    text-transform:lowercase;
    font-size:17px;
    color: var(--fg, #111111);
    filter:blur(1px);
    letter-spacing:0.2px;
    transition: color 0.7s ease;
  }

  .theme-row{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:10;
  }
  .theme-swatch{
    width:22px;
    height:22px;
    border-radius:50%;
    border:2px solid rgba(0,0,0,0.25);
    cursor:pointer;
    padding:0;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .theme-swatch:hover{ transform:scale(1.15); }
  .theme-swatch.active{ border-color:#000; }
</style>

<body>

  <div class="theme-row" id="themeRow"></div>

      <a class="row" href="https://t.me/samayyyy" target="_blank" rel="noopener">telegram</a>
      <a class="row" href="https://discord.com/users/newuton" target="_blank" rel="noopener">discord</a>
      <a class="row" href="https://youtube.com/@samay.mp4" target="_blank" rel="noopener">youtube</a>
    </div>

    <div class="counter" id="visitCounter">visitor no. 0</div>
  </div>

  <script>
    (function(){
      var themes = [
        { name:'green', bg:'#8ace00', fg:'#111111' },
        { name:'white', bg:'#ffffff', fg:'#111111' },
        { name:'blue',  bg:'#0a009c', fg:'#ffffff' },
        { name:'red',   bg:'#851812', fg:'#ffffff' },
        { name:'night', bg:'#111111', fg:'#8ace00' }
      ];
      var metaTheme = document.getElementById('themeColorMeta');
      var row = document.getElementById('themeRow');

      function applyTheme(t, btn){
        document.body.style.setProperty('--bg', t.bg);
        document.body.style.setProperty('--fg', t.fg);
        metaTheme.setAttribute('content', t.bg);
        row.querySelectorAll('.theme-swatch').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
      }

      themes.forEach(function(t, i){
        var btn = document.createElement('button');
        btn.className = 'theme-swatch';
        btn.style.background = t.bg;
        btn.setAttribute('aria-label', t.name + ' theme');
        btn.addEventListener('click', function(){ applyTheme(t, btn); });
        row.appendChild(btn);
        if(i === 0){ applyTheme(t, btn); }
      });
    })();
  </script>

  <script>
    (function(){
      var el = document.getElementById('visitCounter');
      var key = 'samay-contact-links-2026';
      fetch('https://countapi.mileshilliard.com/api/v1/hit/' + key)
        .then(function(res){ return res.json(); })
        .then(function(data){
          var val = data.value !== undefined ? data.value : data.count;
          var pad = String(val).padStart(4, '0');
          el.textContent = 'visitor no. ' + pad;
        })
        .catch(function(){
          el.textContent = 'visitor no. ----';
        });
    })();
  </script>

</body>
