  <script>
    (function(){
      var actx = null;
      function tick(cutoffHz, duration){
        try{
          if(!actx){ actx = new (window.AudioContext || window.webkitAudioContext)(); }
          var bufferSize = Math.max(1, Math.floor(actx.sampleRate * duration));
          var buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
          var data = buffer.getChannelData(0);
          for(var i = 0; i < bufferSize; i++){
            var env = Math.pow(1 - i / bufferSize, 3);
            data[i] = (Math.random() * 2 - 1) * env;
          }
          var src = actx.createBufferSource();
          src.buffer = buffer;
          var filter = actx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = cutoffHz;
          var gain = actx.createGain();
          gain.gain.value = 0.5;
          src.connect(filter);
          filter.connect(gain);
          gain.connect(actx.destination);
          src.start();
        }catch(e){}
      }
      window.__bratTick = tick;

      document.querySelectorAll('.row').forEach(function(a){
        a.addEventListener('click', function(){ tick(3500, 0.025); });
      });
    })();
  </script>

  <script>
    (function(){
      var themes = [
        { name:'green', bg:'#8ace00', fg:'#111111' },
        { name:'white', bg:'#ffffff', fg:'#111111' },
        { name:'blue',  bg:'#0a009c', fg:'#ffffff' },
        { name:'red',   bg:'#851812', fg:'#ffffff' },
        { name:'night', bg:'#111111', fg:'#8ace00' }
      ];
      var storageKey = 'samay-brat-theme';
      var metaTheme = document.getElementById('themeColorMeta');
      var row = document.getElementById('themeRow');
      var cursorStyleEl = document.getElementById('cursorOverride');

      function setCursorColor(color){
        if(!cursorStyleEl) return;
        var c = color.replace(/#/g, '%23');
        var bodyCursor = "url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\"><line x1=\"10\" y1=\"2\" x2=\"10\" y2=\"18\" stroke=\"" + c + "\" stroke-width=\"2\"/><line x1=\"2\" y1=\"10\" x2=\"18\" y2=\"10\" stroke=\"" + c + "\" stroke-width=\"2\"/></svg>') 10 10, auto";
        var linkCursor = "url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"26\" height=\"26\"><path d=\"M2 2 L2 8 M2 2 L8 2 M24 2 L24 8 M24 2 L18 2 M2 24 L2 18 M2 24 L8 24 M24 24 L24 18 M24 24 L18 24\" stroke=\"" + c + "\" stroke-width=\"2.5\" fill=\"none\"/></svg>') 13 13, pointer";
        cursorStyleEl.textContent = 'body{cursor:' + bodyCursor + ';} a{cursor:' + linkCursor + ';}';
      }

      function applyTheme(t, btn, playSound){
        document.body.style.setProperty('--bg', t.bg);
        document.body.style.setProperty('--fg', t.fg);
        metaTheme.setAttribute('content', t.bg);
        row.querySelectorAll('.theme-swatch').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        setCursorColor(t.fg);
        try{ localStorage.setItem(storageKey, t.name); }catch(e){}
        if(playSound && window.__bratTick){ window.__bratTick(2200, 0.04); }
      }

      var saved = null;
      try{ saved = localStorage.getItem(storageKey); }catch(e){}

      var buttons = [];
      themes.forEach(function(t, i){
        var btn = document.createElement('button');
        btn.className = 'theme-swatch';
        btn.style.background = t.bg;
        btn.setAttribute('aria-label', t.name + ' theme');
        btn.addEventListener('click', function(){ applyTheme(t, btn, true); });
        row.appendChild(btn);
        buttons.push(btn);
      });

      var startIndex = 0;
      if(saved){
        var found = themes.findIndex(function(t){ return t.name === saved; });
        if(found !== -1){ startIndex = found; }
      } else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
        startIndex = themes.findIndex(function(t){ return t.name === 'night'; });
      }
      applyTheme(themes[startIndex], buttons[startIndex], false);
    })();
  </script>

  <script>
    (function(){
      var el = document.getElementById('liveClock');
      if(!el) return;
      function pad(n){ return n < 10 ? '0' + n : '' + n; }
      function partOfDay(h){
        if(h < 5) return 'dead of night';
        if(h < 7) return 'dawn';
        if(h < 12) return 'forenoon';
        if(h < 17) return 'midday';
        if(h < 20) return 'dusk';
        return 'afterdark';
      }
      function update(){
        var d = new Date();
        var h = d.getHours();
        var timeStr = pad(h) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        el.textContent = "currently it's " + timeStr + ', ' + partOfDay(h);
      }
      update();
      setInterval(update, 1000);
    })();
  </script>

  <script>
    (function(){
      // change this date to today whenever you actually update the page
      var LAST_UPDATED = '2026-08-16';

      var el = document.getElementById('lastUpdated');
      if(!el) return;
      var updated = new Date(LAST_UPDATED + 'T00:00:00');
      var now = new Date();
      var startOfUpdated = new Date(updated.getFullYear(), updated.getMonth(), updated.getDate());
      var startOfNow = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var dayMs = 24 * 60 * 60 * 1000;
      var days = Math.round((startOfNow - startOfUpdated) / dayMs);

      var label;
      if(days <= 0){ label = 'today'; }
      else if(days === 1){ label = 'yesterday'; }
      else if(days === 2){ label = 'day before yesterday'; }
      else if(days < 7){ label = days + ' days ago'; }
      else if(days < 14){ label = '1 week ago'; }
      else if(days < 21){ label = '2 weeks ago'; }
      else if(days < 28){ label = '3 weeks ago'; }
      else if(days < 60){ label = '1 month ago'; }
      else if(days < 365){ label = Math.round(days / 30) + ' months ago'; }
      else {
        var years = Math.round(days / 365);
        label = years + (years === 1 ? ' year ago' : ' years ago');
      }

      el.textContent = 'last updated ' + label;
    })();
  </script>
