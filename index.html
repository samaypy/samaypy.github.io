<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Samay — iPod</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100vh;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  body{
    min-height:100vh;
    background: radial-gradient(circle at 50% 20%, #3a3f4a, #14161c 75%);
    display:flex; align-items:center; justify-content:center;
    padding:36px 16px;
  }

  .ipod{
    width:100%; max-width:300px;
    background:linear-gradient(160deg,#fdfdfd,#e4e4e4 60%,#cfcfcf);
    border-radius:34px;
    padding:16px 16px 26px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.6);
  }

  .screen-frame{
    background:#0c0c0c;
    border-radius:10px;
    padding:5px;
    box-shadow: inset 0 0 0 1px #333, 0 2px 6px rgba(0,0,0,0.5);
  }
  .screen{
    background:#f5f7f2;
    border-radius:5px;
    overflow:hidden;
    min-height:300px;
    display:flex; flex-direction:column;
  }
  .statusbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 8px 5px;
    background:linear-gradient(180deg,#dfe3e6,#c7cdd2);
    border-bottom:1px solid #9aa0a6;
    font-size:11px; font-weight:bold; color:#222;
  }
  .battery{
    width:16px;height:8px; border:1px solid #333; border-radius:1px;
    position:relative;
  }
  .battery::after{ content:''; position:absolute; right:-3px; top:2px; width:2px; height:4px; background:#333; }
  .battery::before{ content:''; position:absolute; inset:1px; width:70%; background:#333; }

  .menu-title{
    text-align:center; font-size:13px; font-weight:bold; color:#111;
    padding:6px 0 5px;
    background:linear-gradient(180deg,#eef1f3,#dde2e6);
    border-bottom:1px solid #b8bec4;
  }

  .rows{ flex:1; }
  .row{
    display:flex; align-items:center; gap:8px;
    padding:9px 10px;
    text-decoration:none;
    color:#111;
    font-size:13px; font-weight:500;
    border-bottom:1px solid #e2e5e0;
    position:relative;
  }
  .row .rlabel{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .rsub{ font-size:10px; color:#8a8f86; }
  .row .chev{ font-size:13px; color:#9aa0a6; }

  .row.selected, .row:hover, .row:active{
    background:linear-gradient(180deg,#3f7fe0,#1c4fc4);
    color:#fff;
  }
  .row.selected .rsub, .row:hover .rsub, .row:active .rsub{ color:#dce6ff; }
  .row.selected .chev, .row:hover .chev, .row:active .chev{ color:#fff; }

  .footer-text{
    text-align:center; padding:8px 0; font-size:10px; color:#8a8f86;
    background:#eef1ef;
  }

  /* click wheel */
  .wheel-wrap{
    margin-top:26px;
    display:flex; justify-content:center;
  }
  .wheel{
    width:210px; height:210px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #f7f7f7, #d3d3d3 55%, #bdbdbd 100%);
    box-shadow: inset 0 0 0 1px #fff, 0 3px 8px rgba(0,0,0,0.35);
    position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .wheel-label{
    position:absolute; font-size:11px; font-weight:600; color:#6b6b6b; letter-spacing:0.5px;
  }
  .wl-menu{ top:16px; }
  .wl-prev{ left:16px; font-size:16px; }
  .wl-next{ right:16px; font-size:16px; }
  .wl-play{ bottom:14px; font-size:14px; }

  .center-btn{
    width:82px; height:82px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #e9e9e9 70%);
    box-shadow: inset 0 0 0 1px #d2d2d2, 0 1px 3px rgba(0,0,0,0.25);
  }

  @media (max-width:340px){
    .wheel{ width:180px; height:180px; }
    .center-btn{ width:70px; height:70px; }
  }
</style>
</head>
<body>

  <div class="ipod">
    <div class="screen-frame">
      <div class="screen">
        <div class="statusbar">
          <span>iPod</span>
          <span class="battery"></span>
        </div>
        <div class="menu-title">Contacts</div>

        <div class="rows">
          <a class="row selected" href="https://instagram.com/samay.jpg" target="_blank" rel="noopener">
            <span class="rlabel">Instagram</span>
            <span class="rsub">@samay.jpg</span>
            <span class="chev">›</span>
          </a>
          <a class="row" href="https://wa.me/919414848901" target="_blank" rel="noopener">
            <span class="rlabel">WhatsApp</span>
            <span class="rsub">Chat</span>
            <span class="chev">›</span>
          </a>
          <a class="row" href="tel:+917230072629">
            <span class="rlabel">Phone</span>
            <span class="rsub">Call</span>
            <span class="chev">›</span>
          </a>
          <a class="row" href="https://linkedin.com/in/samaychandak" target="_blank" rel="noopener">
            <span class="rlabel">LinkedIn</span>
            <span class="rsub">Profile</span>
            <span class="chev">›</span>
          </a>
          <a class="row" href="mailto:samaychandak06@gmail.com">
            <span class="rlabel">Email</span>
            <span class="rsub">Compose</span>
            <span class="chev">›</span>
          </a>
        </div>

        <div class="footer-text">Samay ✧ 5 of 5</div>
      </div>
    </div>

    <div class="wheel-wrap">
      <div class="wheel">
        <span class="wheel-label wl-menu">MENU</span>
        <span class="wheel-label wl-prev">◀◀</span>
        <span class="wheel-label wl-next">▶▶</span>
        <span class="wheel-label wl-play">▶❙❙</span>
        <div class="center-btn"></div>
      </div>
    </div>
  </div>

</body>
</html>
